{% extends "base.html" %}
{% block main %}
<section class="page-head">
  <div class="wrap">
    <div class="crumb"><a href="/">홈</a><span>/</span><span>설정 점검</span></div>
    <h1>홈페이지 기능 설정 점검</h1>
    <p>문의 접수와 회원 기능에 필요한 설정이 되어 있는지 확인합니다. 설정을 바꾼 뒤에는 Cloudflare에서 다시 배포해야 반영됩니다.</p>
  </div>
</section>
<section class="section-tight">
  <div class="wrap narrow">
    <ul class="check-list" id="check-list"><li class="muted">확인 중…</li></ul>
    <p class="footnote">이 페이지는 검색엔진에 노출되지 않으며, 설정 여부(켜짐/꺼짐)만 보여주고 비밀값은 표시하지 않습니다.</p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var list=document.getElementById('check-list');
  function row(ok,title,desc){return '<li class="'+(ok?'ok':'no')+'"><span class="mk">'+(ok?'완료':'필요')+'</span><div><b>'+title+'</b><p>'+desc+'</p></div></li>';}
  fetch('/api/health',{cache:'no-store'}).then(function(r){return r.json()}).then(function(h){
    list.innerHTML=[
      row(h.db_bound,'① D1 데이터베이스 연결 (DB)', h.db_bound?'Pages 프로젝트에 DB 바인딩이 연결되어 있습니다.':'Settings → Bindings → D1 database, 변수명 <code>DB</code>로 연결해 주세요.'),
      row(h.db_ready,'② 테이블 자동 생성', h.db_ready?'회원·문의 테이블이 준비되었습니다.':(h.db_bound?'DB 접근 중 오류가 있습니다: '+(h.db_error||'알 수 없음'):'①을 먼저 완료해 주세요. 테이블은 자동으로 만들어집니다.')),
      row(h.mail,'③ 이메일 발송 (RESEND_API_KEY)', h.mail?'문의 알림·인증 메일을 보낼 수 있습니다.':'Settings → Variables and Secrets에 <code>RESEND_API_KEY</code>를 Secret으로 넣어 주세요.'),
      row(h.contact_to_set,'④ 문의 알림 받을 주소 (CONTACT_TO)', h.contact_to_set?'설정됨':'비워 두면 spaceblank0100@gmail.com으로 받습니다. (선택)'),
      row(h.mail_from_set,'⑤ 보내는 주소 (CONTACT_FROM)', h.mail_from_set?'설정됨':'Resend에서 vacancy.co.kr 도메인을 인증한 뒤 <code>공백 &lt;noreply@vacancy.co.kr&gt;</code>로 넣어 주세요. 인증 전에는 가입한 본인 메일로만 발송됩니다.'),
      row(h.admin_set,'⑥ 관리자 이메일 (ADMIN_EMAILS)', h.admin_set?'설정됨 — 해당 이메일로 가입하고 이메일 인증을 마치면 /admin을 쓸 수 있습니다.':'관리자로 쓸 이메일을 넣어 주세요. 여러 개면 쉼표로 구분합니다.')
    ].join('');
  }).catch(function(){ list.innerHTML=row(false,'서버 기능(Functions) 응답 없음','배포가 완료되었는지, functions 폴더가 GitHub에 함께 올라갔는지 확인해 주세요.'); });
})();
</script>
{% endblock %}
