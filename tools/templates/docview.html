{% extends "base.html" %}
{% block main %}
<section class="page-head">
  <div class="wrap">
    <div class="crumb"><a href="/">홈</a><span>/</span><span>받은 자료</span></div>
    <h1 id="dv-title">받은 자료</h1>
    <p id="dv-meta">불러오는 중…</p>
  </div>
</section>
<section class="section-tight">
  <div class="wrap">
    <div class="dv-grid" id="dv-body" hidden>
      <article class="dv-text" id="dv-text"></article>
      <aside class="dv-side">
        <div class="box" id="dv-file" hidden>
          <b>첨부 파일</b>
          <p id="dv-file-name"></p>
          <a class="btn btn-primary btn-block" id="dv-dl" href="#">내려받기</a>
        </div>
        <div class="box" id="dv-link" hidden>
          <b>관련 링크</b>
          <a class="btn btn-outline btn-block" id="dv-link-a" href="#" target="_blank" rel="noopener">열기</a>
        </div>
        <div class="box">
          <b>문의하기</b>
          <p>자료에 대해 궁금하신 점은 받으신 메일에 답장하시거나 아래로 문의해 주세요.</p>
          <a class="link-more" href="/contact">공간 검토 요청하기</a>
        </div>
      </aside>
    </div>
    <div class="notice" id="dv-err" hidden></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var q=new URLSearchParams(location.search), t=q.get('t'), d=q.get('d');
  var key=t?'t='+encodeURIComponent(t):(d?'d='+encodeURIComponent(d):'');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function size(n){return !n?'':n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';}
  var err=document.getElementById('dv-err');
  if(!key){err.textContent='자료 주소가 올바르지 않습니다. 받으신 메일의 버튼을 다시 눌러 주세요.';err.hidden=false;document.getElementById('dv-meta').textContent='';return;}
  fetch('/api/docs/view?'+key,{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){
      if(j.error==='unauthorized'){location.replace('/login?next='+encodeURIComponent(location.pathname+location.search));return;}
      err.textContent='자료를 찾을 수 없습니다. 링크가 잘못되었거나 자료가 삭제되었습니다. 필요하시면 spaceblank0100@gmail.com 으로 문의해 주세요.';err.hidden=false;document.getElementById('dv-meta').textContent='';return;
    }
    var it=j.item;
    document.title=it.title+' — 공백';
    document.getElementById('dv-title').textContent=it.title;
    document.getElementById('dv-meta').textContent=(it.name?it.name+'님께 · ':'')+(it.sent_at||'').slice(0,10)+' 공백 발송';
    document.getElementById('dv-text').innerHTML=esc(it.body).split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
    if(it.file_name){document.getElementById('dv-file').hidden=false;document.getElementById('dv-file-name').textContent=it.file_name+' · '+size(it.file_size);document.getElementById('dv-dl').href='/api/docs/file?'+key;}
    if(it.link_url){document.getElementById('dv-link').hidden=false;document.getElementById('dv-link-a').href=it.link_url;}
    document.getElementById('dv-body').hidden=false;
  }).catch(function(){err.textContent='잠시 후 다시 시도해 주세요.';err.hidden=false;});
})();
</script>
{% endblock %}
